name: NOVA public website CI

on:
  pull_request:
  push:
    branches: [main, "feat/nova-website-finalization-001"]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 (pinned commit; update deliberately)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (pinned commit; update deliberately)
        with:
          bun-version: 1.2.17
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Dependency advisories
        run: bun audit
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Unit and route tests
        run: bun run test
      - name: Production build
        run: bun run build
