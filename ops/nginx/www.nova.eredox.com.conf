# Isolated public NOVA website edge vhost.
#
# Install this vhost in the existing edge configuration only after the
# www.nova.eredox.com certificate files exist in /etc/nginx/certs. The
# HTTP-01 location is intentionally preserved for the normal certbot webroot
# renewal flow.

server {
    listen 80;
    server_name www.nova.eredox.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/nova/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.nova.eredox.com;

    ssl_certificate     /etc/nginx/certs/www.nova.eredox.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/www.nova.eredox.com.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/nova/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://nova-public-website:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
