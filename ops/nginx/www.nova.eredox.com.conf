# Isolated public NOVA website edge vhost.
#
# Install this vhost in the existing edge configuration only after the
# www.nova.eredox.com certificate files exist in /etc/nginx/certs. The
# HTTP-01 location is intentionally preserved for the normal certbot webroot
# renewal flow.
#
# Header ownership (single source per header - never duplicate):
#   * this edge vhost: HSTS, X-Frame-Options, X-Content-Type-Options,
#     Referrer-Policy, Permissions-Policy
#   * the application (src/lib/security-headers.ts): Content-Security-Policy
#     (per-request script nonce), Cross-Origin-Opener-Policy, and fallbacks for
#     nosniff/Referrer-Policy only when absent.
# Do NOT add a Content-Security-Policy here: a static edge policy cannot carry
# the per-request nonce and would force 'unsafe-inline' scripts.

# Bound public form abuse at the edge (the app also rate limits per client).
limit_req_zone $binary_remote_addr zone=nova_forms:10m rate=6r/m;

server {
    listen 80;
    server_name www.nova.eredox.com;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/nova/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.nova.eredox.com;

    ssl_certificate     /etc/nginx/certs/www.nova.eredox.com.fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/www.nova.eredox.com.privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    server_tokens off;

    # Permanent canonical form for trailing slashes (the app would answer 307).
    rewrite ^/(.+)/$ /$1 permanent;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # No Content-Security-Policy here - the application owns it (see header above).

    location ^~ /.well-known/acme-challenge/ {
        root /opt/nova/acme-webroot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api/forms {
        limit_req zone=nova_forms burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 40k;
        proxy_pass http://nova-public-website:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    location / {
        proxy_pass http://nova-public-website:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
